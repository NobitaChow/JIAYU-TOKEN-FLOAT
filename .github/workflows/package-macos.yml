name: Package macOS DMG
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Apple Silicon application
        run: ./build.sh
      - name: Install packaging dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-env"
          "$RUNNER_TEMP/dmg-env/bin/python" -m pip install dmgbuild==1.6.7
      - name: Create guided DMG
        run: |
          mkdir -p dist
          "$RUNNER_TEMP/dmg-env/bin/python" scripts/package_guide.py --app 'build/JIAYU Token Float 2.1.0.app' --manual Docs/JIAYU-TOKEN-FLOAT-2.0.0-MANUAL-ZH-CN.pdf --background Assets/installer-background.png --output dist/JIAYU-TOKEN-FLOAT-2.1.0-APPLE-SILICON.dmg
      - name: Verify final image and embedded application
        run: |
          set -euo pipefail
          hdiutil verify dist/JIAYU-TOKEN-FLOAT-2.1.0-APPLE-SILICON.dmg
          mkdir -p "$RUNNER_TEMP/token-float-mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/token-float-mount" dist/JIAYU-TOKEN-FLOAT-2.1.0-APPLE-SILICON.dmg
          trap 'hdiutil detach "$RUNNER_TEMP/token-float-mount"' EXIT
          codesign --verify --deep --strict "$RUNNER_TEMP/token-float-mount/JIAYU Token Float 2.1.0.app"
          cmp 'build/JIAYU Token Float 2.1.0.app/Contents/MacOS/TokenFloat' "$RUNNER_TEMP/token-float-mount/JIAYU Token Float 2.1.0.app/Contents/MacOS/TokenFloat"
          codesign --verify --strict "$RUNNER_TEMP/token-float-mount/JIAYU Token Float 2.1.0.app/Contents/Helpers/ClientFollower"
          cmp 'build/JIAYU Token Float 2.1.0.app/Contents/Helpers/ClientFollower' "$RUNNER_TEMP/token-float-mount/JIAYU Token Float 2.1.0.app/Contents/Helpers/ClientFollower"
          test -s "$RUNNER_TEMP/token-float-mount/JIAYU Token Float 2.1.0.app/Contents/Resources/ClientFollower.swift"
          test -s "$RUNNER_TEMP/token-float-mount/JIAYU Token Float 2.1.0.app/Contents/Resources/MPL-2.0.txt"
          test "$(readlink "$RUNNER_TEMP/token-float-mount/Applications")" = /Applications
          test -s "$RUNNER_TEMP/token-float-mount/使用说明书.pdf"
          test -s "$RUNNER_TEMP/token-float-mount/安装须知.txt"
          shasum -a 256 dist/JIAYU-TOKEN-FLOAT-2.1.0-APPLE-SILICON.dmg > dist/DMG-SHA256.txt
          shasum -a 256 'build/JIAYU Token Float 2.1.0.app/Contents/MacOS/TokenFloat' > dist/EXECUTABLE-SHA256.txt
          # Internal verification artifact; only the DMG is published as the installer.
          ditto -c -k --sequesterRsrc --keepParent 'build/JIAYU Token Float 2.1.0.app' dist/application-for-verification.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JIAYU-TOKEN-FLOAT-2.1.0-MACOS
          path: dist/
          retention-days: 7
